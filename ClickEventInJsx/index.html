<!doctype html>
<html lang="en">
  <head>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <title>React App</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      let buttonText = "Show Element Below";
      let paraText = "";
      let toggle = true;
      const setShow = () => {
        toggle == true
          ? ((buttonText = "Hide Element Below"),
            (paraText = "Hello ninjas, i am here"),
            (toggle = false))
          : ((buttonText = "Show Element Below"),
            (paraText = ""),
            (toggle = true));

        rootElement.render(<App />);
      };

      const App = () => (
        <>
          <h1>Coding Ninjas</h1>
          <button onClick={setShow}>
            {/* Button's Text */}
            {buttonText}
          </button>

          {/* Your Paragraph text */}
          <p>{paraText}</p>
        </>
      );

      const rootElement = ReactDOM.createRoot(document.getElementById("root"));
      rootElement.render(<App />);
    </script>
  </body>
</html>
