<!doctype html>
<html lang="en">
  <head>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>React App</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const food = {
        pizza: {
          name: "Pizza",
          image:
            "https://res.cloudinary.com/dl26pbek4/image/upload/v1672294935/assets/shourav-sheikh-a66sGfOnnqQ-unsplash_dufyvk.jpg",
        },
        burger: {
          name: "Burger",
          image:
            "https://res.cloudinary.com/dl26pbek4/image/upload/v1672294934/assets/food-photographer-E94j3rMcxlw-unsplash_kuljtd.jpg",
        },
        pasta: {
          name: "Pasta",
          image:
            "https://res.cloudinary.com/dl26pbek4/image/upload/v1672294934/assets/pixzolo-photography-aeESmmFKH0M-unsplash_wag5lc.jpg",
        },
        sushi: {
          name: "Sushi",
          image: "https://happycampersgf.com/cdn/shop/articles/Vegan-Sushi.png",
        },
        pavBhaji: {
          name: "Pav Bhaji",
          image:
            "https://blog.eatfit.in/wp-content/uploads/2023/02/image-15.png",
        },
      };

      let favouriteFood;

      //  Single handler function
      const handleFoodClick = (selectedFood) => {
        favouriteFood = selectedFood;
        rootElement.render(<App />);
      };

      const FavouriteFood = () => (
        <div className="favourite-food">
          <span>Your favourite food is:</span>
          <h3>{favouriteFood.name}</h3>
          <img src={favouriteFood.image} />
        </div>
      );

      const App = () => {
        // Convert object to array
        const foodItems = Object.values(food);

        return (
          <React.Fragment>
            {/* Render only when food is selected */}
            {favouriteFood && <FavouriteFood />}

            <h2>Select your favourite food</h2>

            <div className="App">
              <div className="food-list">
                {foodItems.map((item, index) => (
                  <div key={index} onClick={() => handleFoodClick(item)}>
                    <h3>{item.name}</h3>
                    <img src={item.image} />
                  </div>
                ))}
              </div>
            </div>
          </React.Fragment>
        );
      };

      const rootElement = ReactDOM.createRoot(document.getElementById("root"));

      rootElement.render(<App />);
    </script>
  </body>
</html>
